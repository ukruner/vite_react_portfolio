<fieldset>  <div className='grid gap-4'>
    <legend>Do you know the diagnosis?</legend>
    <div className='flex gap-2'><label>
<input type='radio' id='radiodiagnosis' name='radiodiagnosis' value='yes'/> Yes
</label>
<label>
<input type='radio' id='radiodiagnosis' name='radiodiagnosis' value='no'/> No
</label></div></div></fieldset>
<label htmlFor='duration'>How long have you had your problem for?</label>
<select id='duration' name='duration'>
<option hidden disabled selected value></option>
    <option value='1-2weeks'>1-2 weeks</option>
    <option value='3-12weeks'>3-12 weeks</option>
    <option value='12-24weeks'>3-6 months</option>
    <option value='over24weeks'>Over 6 months</option>
</select>
<div className='flex gap-2'>
<input type='checkbox' id='offwork' name='offwork' onChange={handleCheck} checked={isCheckedObject.offwork}></input>
<label htmlFor='offwork' >Are you currently off work because of this issue?</label>
</div>
{isCheckedObject.offwork && <div className='grid gap-4'>
    <label htmlFor='offworkduration'>For how long?</label>
    <select id='offworkduration' name='offworkduration'>
    <option hidden disabled selected value></option>
    <option value='1-2weeks'>1-2 weeks</option>
    <option value='3-12weeks'>3-12 weeks</option>
    <option value='12-24weeks'>3-6 months</option>
    <option value='over24weeks'>Over 6 months</option>
</select></div>}
<div className='flex gap-2'><input type='checkbox'  id='treatment' name='treatment' checked={isCheckedObject.treatment} onChange={handleCheck}></input>
<label htmlFor='treatment'>Are you currently receiving any treatment?</label></div>
    {isCheckedObject.treatment && <div className='grid gap-4'>
    <label htmlFor='caremodality'>Who is it with, and who provides it?</label>
    <select id='caremodality' name='caremodality'>
    <option hidden disabled selected value></option>
    <option value='osteopathy'>Osteopath</option>
    <option value='chiropractor'>Chiropractor</option>
    <option value='physiotherapy'>Physiotherapist</option>
    <option value='massage'>Massage</option>
    <option value='alternative'>Alternative</option>
</select>
<fieldset><div id='sourcecheckboxes' className='flex gap-2'>
    
    <input type='radio' id='careprovider' value='nhs' name='careprovider'></input>
    <label htmlFor='nhs'>NHS</label>
    <input type='radio' id='careprovider' value='private' name='careprovider'></input>
    <label htmlFor='private' >Private</label>
    <input type='radio' id='careprovider' value='other' name='careprovider'></input>
    <label htmlFor='other'>Other</label>
</div></fieldset>
<label htmlFor='exercisenumber'>How many exercises were you given to do</label>
    <select id='exercisenumber' name='exercisenumber'>
    <option hidden disabled selected value></option>
    <option value='1to3exercises'>1-3</option>
    <option value='3-6exercises'>3-6</option>
    <option value='over6exercises'>6 or more</option>
    <option value='multiple'>Multiple routines</option>
    <option value='none'>None</option></select>
<label htmlFor='apptfrequency'>How often do you see your therapist?</label>
    <select name='apptfrequency' id='apptfrequency'>
    <option hidden disabled selected value></option>
    <option value='1-week'>Once a week</option>
    <option value='2-3weeks'>Once every 2-3 weeks</option>
    <option value='3-6weeks'>Once every 3-6 weeks</option>
    <option value='over6weeks'>More than 6 weeks between appointments</option>
    <option value='discharge'>Only had 1 and got discharged</option></select>
<fieldset>  <div className='grid gap-4'>
    <legend>Have you been given/sent any educational content or information?</legend>
    <div className='flex gap-2'><label>
<input type='radio' id='radioeducation' name='radioeducation' value='yes'/> Yes
</label>
<label>
<input type='radio' id='radioeducation' name='radioeducation' value='no'/> No
</label></div></div></fieldset>
</div>
}
